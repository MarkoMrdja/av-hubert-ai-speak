# @package _group_
#
# AV-HuBERT VSR fine-tuning config for a SINGLE rented 24GB GPU (RunPod RTX 3090/4090).
# Derived from av_hubert/avhubert/conf/finetune/base_vox_30h.yaml.
#
# vs. the original 8-GPU config:
#   distributed_world_size 8 -> 1     : one rented GPU.
#   nprocs_per_node        8 -> 1
#   update_freq            1 -> 4      : gradient accumulation. With max_tokens=2000
#                                        and update_freq=4, effective batch ~= the
#                                        original 8-GPU run (8*1000 vs 1*2000*4).
#   max_tokens          1000 -> 2000   : 24GB comfortably fits larger batches -> faster.
#   max_update         30000 -> 18000  : longer than the 4GB config (10000); closer to
#                                        paper WER while keeping rental cost ~a few hours.
#   num_workers            6 -> 8       : rented boxes usually have plenty of vCPUs.
#   fp16               true             : keep ON.
#
# vs. the 4GB laptop config (lrs2_base_vsr_1gpu.yaml): everything is scaled UP because
# VRAM is no longer the bottleneck. If you ever rent a 16GB card (T4/A4000), drop
# max_tokens back to 1000 and update_freq to 8.
#
# Fill the ??? at launch time (see run_finetune_lrs2.sh, which auto-picks this config).

common:
  fp16: true
  log_format: json
  log_interval: 100
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: ???
  normalize: true          # MUST match the pretrained checkpoint's setting
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  modalities: ["video"]    # VSR = video only. Use ["audio","video"] for AVSR.
  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 8
  max_tokens: 2000         # 24GB fits this; drop to 1000 if you see OOM
  validate_after_updates: 0
  validate_interval: 1
  train_subset: train
  valid_subset: valid

criterion:
  _name: label_smoothed_cross_entropy
  report_accuracy: true
  label_smoothing: 0.1

optimization:
  max_update: 18000
  lr: [0.001]
  sentence_avg: true
  update_freq: [4]         # gradient accumulation for single-GPU effective batch

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 5000       # scaled to max_update=18000
  hold_steps: 0
  decay_steps: 13000
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???            # path to the downloaded pretrained Base checkpoint
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  decoder_layers: 6
  decoder_dropout: 0.1
  decoder_attention_dropout: 0.0
  decoder_activation_dropout: 0.1
  freeze_finetune_updates: 12000   # keep encoder frozen ~2/3 of the run
  share_decoder_input_output_embed: true
  decoder_normalize_before: true

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}

hydra:
  run:
    dir: /workspace/av-hubert-ai-speak/workspace/experiments/lrs3_full_ft
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    hydra_help: ???
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/workspace/av-hubert-ai-speak/workspace/experiments/lrs3_full_ft
    task:
    - task.data=/workspace/av-hubert-ai-speak/data/lrs3_raw/subset_data
    - task.label_dir=/workspace/av-hubert-ai-speak/data/lrs3_raw/subset_data
    - task.tokenizer_bpe_model=/workspace/av-hubert-ai-speak/data/lrs3_raw/subset_data/spm_unigram1000.model
    - model.w2v_path=/workspace/av-hubert-ai-speak/workspace/checkpoints/base_vox_iter5.pt
    - common.user_dir=/workspace/av-hubert-ai-speak/av_hubert/avhubert
    - optimization.max_update=3000
    - optimization.update_freq=[2]
    - dataset.max_tokens=1500
    - dataset.num_workers=6
    - lr_scheduler.warmup_steps=1000
    - lr_scheduler.decay_steps=2000
    - model.freeze_finetune_updates=2000
  job:
    name: hydra_train
    override_dirname: common.user_dir-/workspace/av-hubert-ai-speak/av_hubert/avhubert__dataset.max_tokens-1500__dataset.num_workers-6__lr_scheduler.decay_steps-2000__lr_scheduler.warmup_steps-1000__model.freeze_finetune_updates-2000__optimization.max_update-3000__optimization.update_freq-[2]__task.tokenizer_bpe_model-/workspace/av-hubert-ai-speak/data/lrs3_raw/subset_data/spm_unigram1000.model
    id: ???
    num: ???
    config_name: lrs2_base_vsr_runpod
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: __
        exclude_keys:
        - run
        - task.data
        - task.label_dir
        - model.w2v_path
        - dataset.train_subset
        - dataset.valid_subset
  runtime:
    version: 1.0.7
    cwd: /workspace/av-hubert-ai-speak/av_hubert/avhubert
  verbose: false
